name = "lodge-gym"
main = "worker/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "lodge-gym-db"
database_id = "f8ba012b-9970-423c-83f3-8c32111695e7"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "lodge-gym-photos"

[observability]
enabled = true

# Secret (never committed): SETUP_TOKEN — set in the dashboard or with `wrangler secret put SETUP_TOKEN`.
