name = "lodge-gym"
main = "worker/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "lodge-gym-db"
database_id = "f8ba012b-9970-423c-83f3-8c32111695e7"
migrations_dir = "migrations"

# Rest-timer Web Push: one SQLite-backed Durable Object (works on the Free plan) with an alarm per rest.
[[durable_objects.bindings]]
name = "REST_PUSH"
class_name = "RestPush"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestPush"]

# Weekly backup (Monday 10:17 UTC).
[triggers]
crons = ["17 10 * * 1"]

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "lodge-gym-photos"

[observability]
enabled = true

# Secret (never committed): SETUP_TOKEN — set in the dashboard or with `wrangler secret put SETUP_TOKEN`.
