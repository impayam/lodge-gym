<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active session — effort colors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1),filter 140ms,background 400ms,border-color 400ms,color 400ms;cursor:pointer}
.press:active{transform:scale(.94);filter:brightness(1.15)}
.press:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
.pop{animation:pop 260ms cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.rise{transition:transform 300ms cubic-bezier(.2,.8,.2,1),opacity 200ms}
.ring{transition:stroke-dashoffset 1s linear,stroke 600ms}
.tint{transition:background 800ms ease}
.clay{border:0;background:linear-gradient(180deg,#2E2838 0%,#201B29 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.5),0 10px 22px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.45)}
.clay:active{background:linear-gradient(180deg,#18141F 0%,#221D2A 100%);box-shadow:inset 0 4px 10px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.4);filter:none}
@media (prefers-reduced-motion: reduce){.press,.rise,.ring,.tint{transition:none}.pop{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #120F1A; color: #F3EEF8; font-family: 'Instrument Sans', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="tint" aria-hidden="true" style="{{glow}}"></div>

  <header style="position: relative; padding: 54px 16px 0; display: flex; align-items: center; gap: 10px;">
    <button class="press clay" aria-label="Back" style="width: 46px; height: 46px; border-radius: 16px; color: #F3EEF8; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column;">
      <span style="font-size: 17px; font-weight: 600;">Legs</span>
      <span class="num" style="font-size: 13px; color: #B3A9C4;">{{elapsed}} elapsed</span>
    </div>
    <span style="{{effortChip}}"><span style="{{effortDot}}"></span>{{effortName}}</span>
    <button class="press clay" style="{{finishStyle}}">Finish</button>
  </header>

  <div style="position: relative; padding: 14px 16px 0;">
    <div style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden;" role="progressbar" aria-label="Session effort" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}">
      <span class="tint" style="{{effortBar}}"></span>
    </div>
  </div>

  <main style="position: relative; flex: 1; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <section style="background: rgba(28,23,38,0.86); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 12px; color: #B3A9C4;">Exercise {{exNum}} of 3</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; line-height: 1;">{{ex.name}}</span>
          <span class="num" style="font-size: 13px; color: #B3A9C4;">Last time {{ex.last}}</span>
        </div>
        <a href="#" aria-label="Form video" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.08); color: #F3EEF8; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></a>
      </div>

      <div style="display: grid; grid-template-columns: 36px 1fr 1fr 52px; gap: 8px; font-size: 11px; color: #8E84A0; padding: 0 4px;">
        <span>Set</span><span>Weight lb</span><span>Reps</span><span style="text-align: center;">Done</span>
      </div>
      <sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
        <div style="{{s.row}}">
          <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600; color: #8E84A0; text-align: center;">{{s.n}}</span>
          <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600;">{{s.w}}</span>
          <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600;">{{s.r}}</span>
          <button class="press" aria-label="{{s.label}}" aria-pressed="{{s.pressed}}" onClick="{{s.toggle}}" style="{{s.btn}}">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg class="pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></sc-if>
          </button>
        </div>
      </sc-for>
    </section>

    <section style="background: rgba(28,23,38,0.86); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; color: #B3A9C4;">Effort colors</span>
      <div style="display: flex; gap: 8px; align-items: center;">
        <sc-for list="{{scale}}" as="c" hint-placeholder-count="3">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <span style="{{c.swatch}}"></span>
            <span style="font-size: 12px; color: #D9D1E6;">{{c.name}}</span>
          </span>
        </sc-for>
      </div>
    </section>
  </main>

  <div class="rise" style="{{restStyle}}" role="status" aria-live="polite">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
      <circle class="ring" cx="22" cy="22" r="18" fill="none" stroke="{{accentBright}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="{{ringOffset}}" transform="rotate(-90 22 22)"/>
    </svg>
    <div style="flex: 1; display: flex; flex-direction: column;">
      <span style="font-size: 12px; color: #B3A9C4;">Rest</span>
      <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1;">{{restText}}</span>
    </div>
    <button class="press clay" onClick="{{addRest}}" style="height: 42px; padding: 0 12px; border-radius: 14px; color: {{accentBright}}; font-family: inherit; font-size: 14px; font-weight: 600;">+30 s</button>
    <button class="press" onClick="{{skipRest}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; color: #B3A9C4; font-family: inherit; font-size: 14px; font-weight: 600;">Skip</button>
  </div>

  <footer style="position: relative; padding: 12px 16px 30px; display: flex; gap: 10px;">
    <button class="press clay" aria-label="Previous exercise" onClick="{{prev}}" style="width: 58px; height: 58px; border-radius: 20px; color: #F3EEF8; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="press clay" onClick="{{next}}" style="{{nextStyle}}">{{nextLabel}}</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { ex: 0, done: [[true, false, false, false], [false, false, false], [false, false, false]], rest: 0, restMax: 120, elapsed: 742 };
  }
  componentDidMount() {
    this.t = setInterval(() => this.setState((st) => ({ elapsed: st.elapsed + 1, rest: Math.max(0, st.rest - 1) })), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  mix(a, b, t) {
    const h = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
    const A = h(a), B = h(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  ramp(e, stops) {
    if (e <= 0.5) return this.mix(stops[0], stops[1], e / 0.5);
    return this.mix(stops[1], stops[2], (e - 0.5) / 0.5);
  }
  renderVals() {
    const s = this.state;
    const exs = [
      { name: 'Back Squat', last: '70 × 5', w: 80, r: 5 },
      { name: 'Romanian Deadlift', last: '95 × 8', w: 100, r: 8 },
      { name: 'Leg Press', last: '230 × 10', w: 240, r: 10 }
    ];
    const total = s.done.reduce((n, a) => n + a.length, 0);
    const doneN = s.done.reduce((n, a) => n + a.filter(Boolean).length, 0);
    const e = doneN / total;
    const bright = this.ramp(e, ['#A78BFA', '#F472B6', '#FB923C']);
    const deep = this.ramp(e, ['#7C3AED', '#BE185D', '#C2410C']);
    const effortName = e < 0.34 ? 'Warming up' : e < 0.67 ? 'Working' : 'All in';
    const ex = exs[s.ex];
    const done = s.done[s.ex];
    const current = done.indexOf(false);
    const sets = done.map((d, i) => ({
      n: i + 1, w: ex.w, r: ex.r, done: d, pressed: d ? 'true' : 'false',
      label: (d ? 'Undo set ' : 'Complete set ') + (i + 1),
      toggle: () => {
        const all = s.done.map((a) => a.slice());
        all[s.ex][i] = !d;
        this.setState({ done: all, rest: d ? s.rest : 120, restMax: 120 });
      },
      row: 'display: grid; grid-template-columns: 36px 1fr 1fr 52px; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 14px; ' + (i === current ? 'background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px ' + bright + '66;' : '') + (d ? 'opacity: 0.6;' : ''),
      btn: 'width: 52px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; ' + (d ? 'border: 0; background: #0F0C14; box-shadow: inset 0 3px 8px rgba(0,0,0,.8), inset 0 -1px 0 rgba(255,255,255,.08); color: ' + bright + ';' : 'border: 0; background: linear-gradient(180deg,#2E2838,#201B29); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.16), inset 0 -3px 6px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.55); color: #F3EEF8;')
    }));
    const mm = (t) => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    const resting = s.rest > 0;
    return {
      ex, sets, exNum: s.ex + 1, pct: Math.round(e * 100), effortName,
      accentBright: bright,
      glow: 'position: absolute; left: -80px; right: -80px; top: -120px; height: 420px; background: radial-gradient(closest-side, ' + bright + '55, ' + bright + '00);',
      effortBar: 'display: block; height: 100%; border-radius: 999px; width: ' + Math.max(4, e * 100) + '%; background: linear-gradient(90deg, #A78BFA, #F472B6 ' + (50 / Math.max(e, 0.01)) + '%, #FB923C ' + (100 / Math.max(e, 0.01)) + '%);',
      effortChip: 'display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: ' + bright + '22; font-size: 12px; font-weight: 600; color: #F3EEF8;',
      effortDot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + bright + ';',
      scale: [
        { name: 'Warming up', swatch: 'height: 10px; border-radius: 999px; background: #A78BFA;' },
        { name: 'Working', swatch: 'height: 10px; border-radius: 999px; background: #F472B6;' },
        { name: 'All in', swatch: 'height: 10px; border-radius: 999px; background: #FB923C;' }
      ],
      elapsed: mm(s.elapsed),
      restText: mm(s.rest),
      ringOffset: (113.1 * (1 - s.rest / s.restMax)).toFixed(1),
      restStyle: 'position: absolute; left: 16px; right: 16px; bottom: 104px; height: 68px; box-sizing: border-box; padding: 0 10px 0 12px; border-radius: 20px; background: rgba(36,29,48,0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); ' + (resting ? 'transform: translateY(0); opacity: 1;' : 'transform: translateY(24px); opacity: 0; pointer-events: none;'),
      addRest: () => this.setState({ rest: s.rest + 30, restMax: Math.max(s.restMax, s.rest + 30) }),
      skipRest: () => this.setState({ rest: 0 }),
      prev: () => this.setState({ ex: Math.max(0, s.ex - 1) }),
      next: () => this.setState({ ex: Math.min(exs.length - 1, s.ex + 1) }),
      nextStyle: 'flex: 1; height: 58px; border-radius: 20px; color: ' + bright + '; font-family: Instrument Sans, sans-serif; font-size: 17px; font-weight: 700;',
      finishStyle: 'height: 42px; padding: 0 14px; border-radius: 14px; color: ' + bright + '; font-family: Instrument Sans, sans-serif; font-size: 14px; font-weight: 700;',
      nextLabel: s.ex < exs.length - 1 ? 'Next: ' + exs[s.ex + 1].name : 'Last exercise'
    };
  }
}
</script>
</body>
</html>
