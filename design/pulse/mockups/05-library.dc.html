<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library — Pulse Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1);cursor:pointer}
.press:active{transform:scale(.96)}
.press:focus-visible{outline:2px solid #FF5A1F;outline-offset:3px}
.clay{border:0;background:linear-gradient(180deg,#2C2C32 0%,#1F1F23 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.11),inset 0 -3px 6px rgba(0,0,0,.35),0 7px 15px rgba(0,0,0,.42),0 1.5px 3px rgba(0,0,0,.32)}
.card{background:linear-gradient(180deg,#1B1C20 0%,#131417 100%);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 6px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.25)}
input::placeholder{color:#6F6F78}
@media (prefers-reduced-motion: reduce){.press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; background: linear-gradient(180deg, #2B2C31 0%, #1C1D21 40%, #121316 100%); color: #F2F2F4; font-family: 'Instrument Sans', system-ui, sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 58px 16px 130px; display: flex; flex-direction: column; gap: 14px;">

    <header style="padding: 0 4px; display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="num" style="font-size: 13px; color: #8A8A93;">755 exercises</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 600;">Library</h1>
      </div>
      <button class="press clay" aria-label="Pick by body part" style="height: 44px; padding: 0 14px; border-radius: 15px; color: #FF4FA0; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 13px; font-weight: 700;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 9l5 2 5-2M9.5 21l2.5-7 2.5 7"/></svg>Body</button>
    </header>

    <label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 17px; background: #121214; box-shadow: inset 0 2px 6px rgba(0,0,0,.56), inset 0 -1px 0 rgba(255,255,255,.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search exercises</span>
      <input placeholder="Search exercises" style="flex: 1; border: 0; background: transparent; color: #F2F2F4; font-family: inherit; font-size: 15px; outline: none;">
    </label>

    <div role="group" aria-label="Muscle group" style="display: flex; gap: 8px; flex-wrap: wrap;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
        <button class="{{c.cls}}" aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button>
      </sc-for>
    </div>

    <span style="font-size: 12px; color: #8A8A93; padding: 2px 4px 0;">{{countLine}}</span>

    <sc-for list="{{items}}" as="x" hint-placeholder-count="6">
      <a href="#" class="card" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #F2F2F4; border-radius: 20px;">
        <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 15px; background: #121214; box-shadow: inset 0 2px 5px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; color: {{x.color}};">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.icon}}"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <span style="font-size: 15px; font-weight: 600;">{{x.name}}</span>
          <span style="font-size: 12px; color: #8A8A93;">{{x.muscles}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end;">
          <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 600; line-height: 1;">{{x.best}}</span>
          <span style="font-size: 11px; color: #6F6F78;">{{x.bestLabel}}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav class="clay" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 68px; border-radius: 26px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button class="press" aria-label="{{t.name}}" aria-current="{{t.current}}" style="{{t.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { group: 1 }; }
  renderVals() {
    const s = this.state;
    const groups = ['All', 'Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core'];
    const chips = groups.map((name, i) => ({
      name, sel: i === s.group ? 'true' : 'false', pick: () => this.setState({ group: i }),
      cls: i === s.group ? 'press' : 'press clay',
      style: 'height: 36px; padding: 0 14px; border-radius: 999px; font-family: Instrument Sans, sans-serif; font-size: 13px; font-weight: 600; ' + (i === s.group ? 'border: 0; background: #121214; box-shadow: inset 0 2px 6px rgba(0,0,0,.56), inset 0 -1px 0 rgba(255,255,255,.06); color: #FF4FA0;' : 'color: #C9C9CF;')
    }));
    const bar = 'M3 12h2M19 12h2M6 8v8M18 8v8M9 10v4M15 10v4M9 12h6';
    const db = 'M4 10v4M20 10v4M7 8v8M17 8v8M7 12h10';
    const cable = 'M12 3v6M8 9h8M10 9l-3 12M14 9l3 12';
    const lists = {
      Chest: [
        { name: 'Barbell Bench Press', muscles: 'Chest, front delts, triceps', best: '166', bestLabel: 'est. 1RM', icon: bar },
        { name: 'Incline Dumbbell Press', muscles: 'Upper chest, front delts', best: '75', bestLabel: 'last × 8', icon: db },
        { name: 'Cable Fly', muscles: 'Chest', best: '—', bestLabel: 'not logged', icon: cable },
        { name: 'Dips', muscles: 'Lower chest, triceps', best: '—', bestLabel: 'not logged', icon: bar }
      ]
    };
    const g = groups[s.group];
    const base = lists[g] || [
      { name: 'Barbell Back Squat', muscles: 'Quads, glutes', best: '227', bestLabel: 'est. 1RM', icon: bar },
      { name: 'Conventional Deadlift', muscles: 'Hamstrings, glutes, back', best: '274', bestLabel: 'est. 1RM', icon: bar },
      { name: 'Leg Press', muscles: 'Quads, glutes', best: '240', bestLabel: 'next × 10', icon: cable },
      { name: 'Lat Pulldown', muscles: 'Lats, biceps', best: '60', bestLabel: 'last × 10', icon: cable }
    ];
    const colors = ['#FF4FA0', '#9A7BF2', '#FF5A1F', '#C9C9CF'];
    const items = base.map((x, i) => ({ ...x, color: x.best === '—' ? '#6F6F78' : colors[i % 3] }));
    const icons = {
      Train: 'M3 12h2M19 12h2M6 8v8M18 8v8M9 10v4M15 10v4M9 12h6',
      History: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      Library: 'M5 4h4v16H5zM10 4h4v16h-4zM15 5l4 1-3 14-4-1',
      Reports: 'M5 20V12M10 20V6M15 20v-9M20 20V9M3 20h18',
      Me: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6'
    };
    const tabs = Object.keys(icons).map((k, n) => ({
      name: k, icon: icons[k], current: n === 2 ? 'page' : 'false',
      style: 'height: 52px; margin: 0 6px; border: 0; border-radius: 19px; display: flex; align-items: center; justify-content: center; ' + (n === 2 ? 'background: #121214; box-shadow: inset 0 2px 6px rgba(0,0,0,.56), inset 0 -1px 0 rgba(255,255,255,.06); color: #FF4FA0;' : 'background: transparent; color: #8A8A93;')
    }));
    return { chips, items, tabs, countLine: g === 'All' ? 'Most used first' : g + ', most used first' };
  }
}
</script>
</body>
</html>
