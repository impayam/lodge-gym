<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Me — Pulse Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1);cursor:pointer}
.press:active{transform:scale(.96)}
.press:focus-visible{outline:2px solid #FF5A1F;outline-offset:3px}
.clay{border:0;background:linear-gradient(180deg,#2C2C32 0%,#1F1F23 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.11),inset 0 -3px 6px rgba(0,0,0,.35),0 7px 15px rgba(0,0,0,.42),0 1.5px 3px rgba(0,0,0,.32)}
.card{background:linear-gradient(180deg,#1B1C20 0%,#131417 100%);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 6px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){.press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 1380px; box-sizing: border-box; background: linear-gradient(180deg, #2B2C31 0%, #1C1D21 35%, #121316 100%); color: #F2F2F4; font-family: 'Instrument Sans', system-ui, sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 58px 16px 130px; display: flex; flex-direction: column; gap: 14px;">

    <header style="padding: 0 4px; display: flex; align-items: center; gap: 14px;">
      <span style="width: 56px; height: 56px; border-radius: 20px; background: #121214; box-shadow: inset 0 2px 6px rgba(0,0,0,.56), inset 0 -1px 0 rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: #FF4FA0;">P</span>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600;">Payam</h1>
        <span style="font-size: 13px; color: #8A8A93;">Training since Sep 27, chest is the priority</span>
      </div>
    </header>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; font-weight: 600;">Body</span>
        <button class="press clay" style="height: 36px; padding: 0 12px; border-radius: 12px; color: #FF5A1F; font-family: inherit; font-size: 13px; font-weight: 700;">Log this week</button>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 600; line-height: 1;">[ ]<span style="font-size: 16px; color: #8A8A93;"> lb</span></span>
        <span style="font-size: 12px; color: #8A8A93;">body weight, last logged</span>
      </div>
      <svg width="100%" height="56" viewBox="0 0 326 56" role="img" aria-label="Body weight trend, placeholder until real data" style="display: block;">
        <line x1="0" x2="326" y1="48" y2="48" stroke="#26262B"/>
        <polyline points="4,30 50,28 96,31 142,26 188,24 234,25 280,21 322,19" fill="none" stroke="#9A7BF2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="322" cy="19" r="4.5" fill="#9A7BF2" stroke="#16171A" stroke-width="2"/>
      </svg>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{sizes}}" as="z" hint-placeholder-count="6">
          <div style="padding: 10px 12px; border-radius: 14px; background: #121214; box-shadow: inset 0 2px 5px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 2px;">
            <span class="num" style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600;">{{z.v}}</span>
            <span style="font-size: 11px; color: #8A8A93;">{{z.name}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #6F6F78;">Sizes in inches. New: logged once a week, charted over time.</span>
    </section>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; font-weight: 600;">Progress photos</span>
        <span class="num" style="font-size: 12px; color: #8A8A93;">10 photos</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{photos}}" as="ph" hint-placeholder-count="4">
          <span style="aspect-ratio: 3 / 4; border-radius: 14px; background: #121214; box-shadow: inset 0 2px 5px rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 10px; color: #6F6F78;">{{ph}}</span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="press clay" style="flex: 1; height: 42px; border-radius: 14px; color: #FF4FA0; font-family: inherit; font-size: 13px; font-weight: 700;">Add photo</button>
        <button class="press clay" style="flex: 1; height: 42px; border-radius: 14px; color: #C9C9CF; font-family: inherit; font-size: 13px; font-weight: 600;">Compare two dates</button>
      </div>
    </section>

    <section class="card" style="padding: 6px 16px; display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 13px 0; text-decoration: none; color: #F2F2F4; border-bottom: 1px solid #1F2024;">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: #121214; box-shadow: inset 0 2px 5px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; color: {{r.color}};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 15px; font-weight: 600;">{{r.name}}</span><span style="font-size: 12px; color: #8A8A93;">{{r.sub}}</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F6F78" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </section>
  </div>

  <nav class="clay" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 68px; border-radius: 26px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button class="press" aria-label="{{t.name}}" aria-current="{{t.current}}" style="{{t.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1380}}'>
class Component extends DCLogic {
  renderVals() {
    const icons = {
      Train: 'M3 12h2M19 12h2M6 8v8M18 8v8M9 10v4M15 10v4M9 12h6',
      History: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      Library: 'M5 4h4v16H5zM10 4h4v16h-4zM15 5l4 1-3 14-4-1',
      Reports: 'M5 20V12M10 20V6M15 20v-9M20 20V9M3 20h18',
      Me: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6'
    };
    const tabs = Object.keys(icons).map((k, n) => ({
      name: k, icon: icons[k], current: n === 4 ? 'page' : 'false',
      style: 'height: 52px; margin: 0 6px; border: 0; border-radius: 19px; display: flex; align-items: center; justify-content: center; ' + (n === 4 ? 'background: #121214; box-shadow: inset 0 2px 6px rgba(0,0,0,.56), inset 0 -1px 0 rgba(255,255,255,.06); color: #FF4FA0;' : 'background: transparent; color: #8A8A93;')
    }));
    return {
      tabs,
      sizes: ['Chest', 'Waist', 'Arm', 'Thigh', 'Shoulders', 'Calf'].map((name) => ({ name, v: '[ ]' })),
      photos: ['Sep 27', 'Oct 4', 'Oct 11', 'Oct 13'],
      rows: [
        { name: 'Program', sub: 'Full body, 4 days, active', color: '#FF4FA0', icon: 'M4 6h16M4 12h16M4 18h10' },
        { name: 'Planner', sub: 'Plan the next session', color: '#FF5A1F', icon: 'M4 6h16v14H4zM4 10h16M9 14h6' },
        { name: 'AI reports', sub: 'About $2 a month, Opus', color: '#9A7BF2', icon: 'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z' },
        { name: 'Backup and export', sub: 'Weekly copy every Monday', color: '#C9C9CF', icon: 'M12 4v11M7 10l5 5 5-5M5 20h14' },
        { name: 'Settings', sub: 'Units, rest timer, motion', color: '#C9C9CF', icon: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3' }
      ]
    };
  }
}
</script>
</body>
</html>
