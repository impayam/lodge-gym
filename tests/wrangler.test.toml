# Test-only config: same bindings as wrangler.toml, assets from a small fixture directory.
name = "lodge-gym-test"
main = "../worker/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./fixtures/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "lodge-gym-test"
database_id = "local-test-only"

# Rest-timer Web Push: one SQLite-backed Durable Object (works on the Free plan) with an alarm per rest.
[[durable_objects.bindings]]
name = "REST_PUSH"
class_name = "RestPush"

# AI session reports (SPEC-v3 M9a): one SQLite-backed Durable Object writes them from an alarm (up to 15 min).
[[durable_objects.bindings]]
name = "AI_JOBS"
class_name = "AiJobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestPush"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AiJobs"]

# AI session report and plan advice (SPEC-v3 M9a, M9c; approved 2026-10-13). claude-opus-5-5 takes no temperature;
# effort is the control. Change these without a code change; the key is the ANTHROPIC_API_KEY secret.
[vars]
REPORT_MODEL = "claude-opus-5-5"
REPORT_EFFORT = "low"
ADVICE_EFFORT = "medium"
REPORT_MAX_TOKENS = "3000"
# Training overview (SPEC-v7 M9d), rewritten after every finished session.
OVERVIEW_EFFORT = "medium"
OVERVIEW_MAX_TOKENS = "4000"
# Coach chat (SPEC-v9 M12).
COACH_MODEL = "claude-opus-5-5"
COACH_EFFORT = "medium"
COACH_MAX_TOKENS = "8000"
COACH_CONTEXT_TOKENS = "60000"

# Weekly backup (Monday 10:17 UTC).
[triggers]
crons = ["17 10 * * 1"]

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "lodge-gym-test"
